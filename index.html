<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Fatim &amp; Zoum — Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F8F2E7;
    --cream-2: #FBF7EF;
    --espresso: #3A2A1E;
    --terracotta: #A85632;
    --terracotta-deep: #8C4527;
    --gold: #C9A24B;
    --gold-soft: #E4CE97;
    --blush: #E9CBB0;
    --line: rgba(58,42,30,0.18);
    --wash: rgba(248,242,231,0.72);
    color-scheme: light;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--cream);
    color: var(--espresso);
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    overflow-x: hidden;
  }
  .script{
    font-family: 'Alex Brush', 'Brush Script MT', cursive;
    font-weight: 400;
  }

  #app{
    height: 100vh;
    overflow-y: scroll;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce){
    #app{ scroll-behavior: auto; }
  }

  .panel{
    position: relative;
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 6vh 6vw;
  }

  /* ---------- Reveal animation : apparition en cascade, ligne par ligne ---------- */
  .fade-item{
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.75s cubic-bezier(.2,.7,.3,1), transform 0.75s cubic-bezier(.2,.7,.3,1);
    will-change: opacity, transform;
  }
  .fade-item.show{ opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce){
    .fade-item{ transition: none; opacity: 1; transform: none; }
  }

  /* ---------- Ornament : bouquets dorés dessinés en SVG ---------- */
  .corner{
    position: absolute;
    width: 30vw;
    max-width: 240px;
    min-width: 140px;
    height: auto;
    pointer-events: none;
    z-index: 2;
  }
  .corner.tl{ top: -1.5vh; left: -2vw; transform: rotate(180deg); }
  .corner.br{ bottom: -1.5vh; right: -2vw; }
  .corner.tr{ top: -1.5vh; right: -2vw; transform: rotate(180deg) scaleX(-1); }
  .corner.bl{ bottom: -1.5vh; left: -2vw; transform: scaleX(-1); }
  .corner.small{ width: 18vw; max-width: 130px; }
  .corner img{ width: 100%; height: auto; display: block; }

  /* ---------- Texture marbrée légère ---------- */
  .marble{ position:absolute; inset:0; z-index:0; overflow:hidden; }
  .marble::before{
    content:"";
    position:absolute; inset: -10%;
    background:
      radial-gradient(38% 28% at 15% 12%, rgba(168,86,50,0.05), transparent 60%),
      radial-gradient(30% 40% at 88% 8%, rgba(58,42,30,0.045), transparent 65%),
      radial-gradient(45% 30% at 78% 92%, rgba(168,86,50,0.05), transparent 60%),
      radial-gradient(30% 22% at 8% 85%, rgba(58,42,30,0.04), transparent 60%);
  }
  .marble::after{
    content:"";
    position:absolute; inset:-10%;
    background-image: repeating-linear-gradient(115deg, rgba(58,42,30,0.035) 0px, transparent 2px, transparent 90px, rgba(58,42,30,0.03) 92px, transparent 180px);
  }

  /* sparkle */
  .sparkle{ position:absolute; color: var(--gold); z-index:2; pointer-events:none; }
  .sparkle svg{ width:100%; height:100%; display:block; }

  /* =========================================================
     PANEL 1 — COVER
     ========================================================= */
  #p1{
    color: #fff;
    text-align: center;
    background: #1b120c;
  }
  #p1 .bg, #p5 .bg{
    position: absolute; inset: 0;
    background-size: cover;
    filter: saturate(1.02);
  }
  #p1 .bg{
    background-image: url('data:image/jpeg;base64,...IMAGE...');
    background-position: center 20%;
  }
  #p1 .scrim, #p5 .scrim{
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(15,10,7,0.55) 0%, rgba(15,10,7,0.15) 30%, rgba(15,10,7,0.25) 60%, rgba(15,10,7,0.85) 100%);
  }
  #p1 .content{
    position: relative; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    max-width: 620px;
  }
  .p5-eyebrow{
    text-transform: uppercase;
    letter-spacing: 0.3em;
    font-size: 0.78rem;
    color: var(--gold-soft);
    opacity: 0.9;
    margin: 0;
  }
  .p5-goldline{
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    margin: 4px 0;
  }

  /* ---------- Galerie photo ---------- */
  .gallery-track{
    width: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 0;
    border-radius: 18px;
  }
  .gallery-track::-webkit-scrollbar{ display:none; }
  .gallery-slide{
    flex: 0 0 100%;
    scroll-snap-align: center;
    display:flex; flex-direction:column; align-items:center;
  }
  .gallery-slide img{
    width: 100%;
    max-height: 58vh;
    object-fit: contain;
    background: var(--cream-2);
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(58,42,30,0.22);
  }
  .gallery-slide p{
    margin: 14px 0 0;
    font-style: italic;
    color: var(--espresso);
    opacity: 0.85;
    font-size: 0.98rem;
  }
  .gallery-dots{ display:flex; gap:8px; margin-top: 18px; }
  .gallery-dots button{
    width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid var(--gold); background: transparent; padding:0; cursor:pointer;
  }
  .gallery-dots button.active{ background: var(--gold); }
  .eyebrow-cover{
    font-size: clamp(1rem, 2.6vw, 1.35rem);
    letter-spacing: 0.14em;
    font-weight: 500;
    margin: 0;
  }
  .cover-tagline{
    font-size: clamp(1.5rem, 4.6vw, 2.4rem);
    line-height: 1.25;
    margin: 0;
    color: var(--gold-soft);
  }
  .btn{
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.03em;
    padding: 16px 40px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: #382408;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    transition: transform .5s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease, opacity .75s cubic-bezier(.2,.7,.3,1);
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,0.32); }
  .btn:active{ transform: translateY(0); }
  .btn:focus-visible{ outline: 3px solid var(--gold-soft); outline-offset: 3px; }

  .countdown{ display:flex; align-items:center; justify-content:center; gap: clamp(10px,3vw,20px); }
  .cd-unit{ display:flex; flex-direction:column; align-items:center; min-width: 46px; }
  .cd-num{
    font-size: clamp(1.5rem,5.5vw,2.1rem);
    font-weight: 600;
    color: var(--gold-soft);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .cd-label{
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-top: 4px;
  }

  /* =========================================================
     PANEL 2 — FAIRE-PART
     ========================================================= */
  #p2{
    background:
      radial-gradient(ellipse at 50% -10%, var(--blush) 0%, transparent 55%),
      var(--cream-2);
    text-align: center;
  }
  #p2 .content{ max-width: 640px; display:flex; flex-direction:column; align-items:center; gap: 20px; }
  #p7{
    background:
      radial-gradient(ellipse at 50% -10%, var(--blush) 0%, transparent 55%),
      var(--cream-2);
    text-align: center;
    align-items: flex-start;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  #p7 .content{ display:flex; flex-direction:column; align-items:center; }
  #p8{
    background:
      radial-gradient(ellipse at 50% -10%, var(--blush) 0%, transparent 55%),
      var(--cream-2);
    text-align: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .blessing{
    font-style: italic;
    font-size: clamp(1rem, 2.4vw, 1.15rem);
    line-height: 1.7;
    color: var(--espresso);
    opacity: 0.9;
  }
  .blessing strong{ color: var(--terracotta-deep); font-style: normal; font-weight: 600; }
  .names{
    font-family: 'Alex Brush', cursive;
    color: var(--terracotta-deep);
    line-height: 1;
    font-size: clamp(3.6rem, 12vw, 6.2rem);
  }
  .amp{
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.3rem, 3vw, 1.7rem);
    color: var(--gold);
  }
  .date-row{
    display:flex; align-items:center; gap: 18px; margin-top: 6px;
  }
  .date-line{ width: 44px; height: 1px; background: var(--line); }
  .date-day{ letter-spacing:0.12em; font-size: 0.95rem; }
  .date-num{ font-size: 2.6rem; color: var(--terracotta-deep); font-weight: 600; }
  .date-month{ font-size: 0.95rem; letter-spacing: 0.06em; }
  .date-year{ font-size: 1rem; letter-spacing: 0.2em; color: var(--gold); margin-top: -6px; }
  .invite-text{
    font-size: clamp(0.95rem, 2vw, 1.05rem);
    line-height: 1.75;
    max-width: 480px;
    opacity: 0.88;
  }

  /* =========================================================
     PANEL 3 — PROGRAMME
     ========================================================= */
  .panel.timeline{
    background: var(--cream);
    align-items: flex-start;
  }
  .tl-wrap{ max-width: 560px; margin: 0 auto; width: 100%; }
  .tl-head{ text-align:center; margin-bottom: clamp(24px,4vh,44px); }
  .tl-head h2{
    margin: 0;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    letter-spacing: 0.04em;
    color: var(--terracotta-deep);
    font-weight: 600;
  }
  .tl-head .sub{
    margin-top: 8px;
    font-size: 0.85rem;
    letter-spacing: 0.18em;
    color: var(--gold);
  }
  .tl-head .label{
    font-family:'Alex Brush', cursive;
    font-size: clamp(1.8rem, 4vw, 2.3rem);
    color: var(--espresso);
    margin-top: 10px;
    display:block;
  }
  .tl-list{
    position: relative;
    padding-left: 34px;
  }
  .tl-list::before{
    content:"";
    position:absolute; left: 7px; top: 6px; bottom: 6px; width: 1px;
    background: var(--line);
  }
  .tl-item{ position: relative; padding: 0 0 clamp(18px,3vh,30px) 0; }
  .tl-item::before{
    content:"";
    position:absolute; left: -34px; top: 6px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--cream);
    border: 2px solid var(--terracotta);
  }
  .tl-time{
    display:block;
    font-weight: 600;
    color: var(--terracotta-deep);
    font-size: clamp(1rem, 2.2vw, 1.15rem);
    letter-spacing: 0.03em;
  }
  .tl-what{ font-size: 0.98rem; opacity: 0.85; margin-top: 2px; }


  /* Programme à 10 lignes : heure et texte sur la même ligne pour tenir dans l'écran */
  .tl-compact .tl-item{
    display:flex; align-items:baseline; gap: 14px;
    padding-bottom: clamp(9px, 1.9vh, 18px);
  }
  .tl-compact .tl-item::before{ top: 5px; }
  .tl-compact .tl-time{ flex: 0 0 6.6rem; font-size: clamp(0.95rem, 2.2vw, 1.1rem); }
  .tl-compact .tl-what{ margin-top: 0; font-size: 0.95rem; line-height: 1.3; }
  #p3 .tl-head{ margin-bottom: clamp(14px, 2.6vh, 28px); }
  #p3{ height: auto; min-height: 100vh; }

  .panel-nav-btn{ margin-top: clamp(20px,3.5vh,32px); text-align:center; }

  .gold-frame{
    position:absolute;
    inset: 6vh 7vw;
    border: 1px solid var(--gold);
    transform: rotate(-1.1deg);
    z-index: 0;
    pointer-events: none;
  }
  .gold-frame::after{
    content:"";
    position:absolute; inset:0;
    border: 1px solid var(--gold);
    transform: rotate(2.2deg);
    opacity: 0.6;
  }
  @media (max-width:600px){ .gold-frame{ inset: 3vh 4vw; } }

  .photo-wash{
    position:absolute; inset:0; z-index:0;
    background-image: url('data:image/jpeg;base64,...IMAGE...');
    background-size: cover;
    background-position: center 22%;
    filter: grayscale(0.1) blur(1px);
    opacity: 0.32;
  }

  /* dot nav */
  #dots{
    position: fixed;
    right: max(18px, 2vw);
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    display:flex; flex-direction: column; gap: 12px;
  }
  #dots button{
    width: 9px; height: 9px; border-radius: 50%;
    border: 1px solid var(--gold);
    background: transparent;
    padding: 0; cursor: pointer;
    transition: background .3s ease, transform .3s ease;
  }
  #dots button.active{ background: var(--gold); transform: scale(1.25); }
  #dots button:focus-visible{ outline: 2px solid var(--terracotta); outline-offset: 3px; }
  #p1 ~ #dots, body[data-page="1"] #dots button{ }
  #dots.on-dark button{ border-color: var(--gold-soft); }
  #dots.on-dark button.active{ background: var(--gold-soft); }

  /* ---------- Boutons flottants : partage & musique ---------- */
  #floating-actions{
    position: fixed; left: max(14px, 2vw); bottom: max(14px, 2vh);
    z-index: 25; display:flex; flex-direction:column; gap: 10px;
  }
  .fab{
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(20,14,10,0.55);
    backdrop-filter: blur(6px);
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease;
  }
  .fab:hover{ transform: translateY(-2px); background: rgba(20,14,10,0.7); }
  .fab:focus-visible{ outline: 2px solid var(--gold-soft); outline-offset: 2px; }
  .fab svg{ width: 18px; height: 18px; }
  .fab.on-light{ border-color: rgba(58,42,30,0.25); background: rgba(255,255,255,0.7); color: var(--espresso); }
  .fab.on-light:hover{ background: #fff; }
  #toast{
    position: fixed; left:50%; bottom: 74px; transform: translateX(-50%) translateY(10px);
    background: rgba(20,14,10,0.9); color:#fff; padding: 9px 18px; border-radius: 999px;
    font-size: 0.85rem; z-index: 30; opacity:0; pointer-events:none;
    transition: opacity .3s ease, transform .3s ease;
  }
  #toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .scroll-hint{
    position:absolute; bottom: 22px; left:50%; transform: translateX(-50%);
    z-index: 3; color: rgba(255,255,255,0.85);
    font-size: 0.72rem; letter-spacing: 0.22em;
    display:flex; flex-direction: column; align-items:center; gap:6px;
  }
  .scroll-hint .chevron{
    width: 10px; height: 10px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
    animation: bob 1.8s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .scroll-hint .chevron{ animation: none; } }
  @keyframes bob{ 0%,100%{ transform: rotate(45deg) translate(0,0);} 50%{ transform: rotate(45deg) translate(4px,4px);} }

  footer.final{
    text-align:center; font-size:0.8rem; opacity:0.55; margin-top: clamp(20px,4vh,34px);
    letter-spacing: 0.08em;
  }

  /* ---------- Panel 7 : Les détails ---------- */
  .p5-title-row{
    display:flex; align-items:center; justify-content:center; gap: clamp(14px,4vw,32px);
    margin-bottom: clamp(30px,5vh,48px);
  }
  .p5-bean{ width: clamp(34px,8vw,52px); height: auto; flex-shrink:0; }
  .p5-title{
    font-size: clamp(2.3rem, 9vw, 3.1rem);
    color: var(--gold);
    margin: 0;
    line-height: 1;
  }
  .p5-divider-sm{ width: 46px; height: 1px; background: var(--gold); margin: 8px auto 0; }
  .p5-block{ margin-bottom: clamp(30px,5.5vh,46px); text-align:center; }
  .p5-heading{
    font-size: clamp(1.35rem, 4.6vw, 1.7rem);
    letter-spacing: 0.06em;
    color: var(--espresso);
    font-weight: 500;
    margin: 0 0 10px;
  }
  .p5-block > .p5-divider-sm{ margin: 0 auto clamp(18px,3.5vh,28px); }
  .p5-text{
    line-height: 1.75;
    font-size: clamp(0.98rem,3vw,1.08rem);
    opacity: 0.92;
    margin: 0 0 6px;
  }
  .p5-kita{
    font-size: clamp(1.6rem,5.5vw,2rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin: 6px 0 12px;
  }
  .p5-map{
    display:block;
    max-width: 380px;
    margin: 0 auto;
    text-decoration: none;
    color: inherit;
    transition: transform .25s ease;
  }
  .p5-map:hover{ transform: translateY(-2px); }
  .p5-map svg{ width: 100%; height: auto; display:block; overflow: visible; }
  .p5-maplink{ margin: 12px 0 0; }
  .p5-maplink a{
    color: var(--gold);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 2px;
  }
  .p5-contact{
    display: inline-flex; align-items: center;
    font-size: clamp(1.15rem,4vw,1.4rem);
    font-weight: 600;
    color: var(--espresso);
    text-decoration: none;
    letter-spacing: 0.02em;
  }
  .p5-contact svg{ color: var(--gold); }
  .p5-contact:hover{ text-decoration: underline; }
  .p5-footer{
    font-size: 0.75rem;
    letter-spacing: 0.22em;
    color: var(--gold);
    text-transform: uppercase;
    margin: clamp(10px,2vh,20px) 0 clamp(18px,3vh,26px);
  }

  @media (max-width: 480px){
    .corner{ width: 32vw; }
    .panel{ padding: 5vh 7vw; }
  }
</style>
</head>
